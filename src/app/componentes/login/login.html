<div class="form-container">
  <h2>Iniciar sesión</h2>
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="email">Correo electrónico:</label>
      <input type="email" id="email" formControlName="email" class="form-control" autocomplete="username" />
      <div *ngIf="f.email.touched && f.email.invalid" class="error-text">
        <small *ngIf="f.email.errors?.['required']">El correo es obligatorio.</small>
        <small *ngIf="f.email.errors?.['email']">Ingrese un formato de correo válido.</small>
      </div>
    </div>
    <div class="form-group">
      <label for="password">Contraseña:</label>
      <input type="password" id="password" formControlName="password" class="form-control" autocomplete="current-password" />
      <div *ngIf="f.password.touched && f.password.invalid" class="error-text">
        <small *ngIf="f.password.errors?.['required']">La contraseña es obligatoria.</small>
      </div>
    </div>
    <button type="submit" [disabled]="loginForm.invalid" class="btn-submit">Ingresar</button>
  </form>
  <p role="status">{{ mensaje }}</p>
</div>
